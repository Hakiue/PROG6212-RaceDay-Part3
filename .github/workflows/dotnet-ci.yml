name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files and folders exist
        run: |
          missing=0
          for path in \
            RaceDayApi.sln \
            RaceDayApi/RaceDayApi.csproj \
            RaceDayApi.Tests/RaceDayApi.Tests.csproj \
            RaceDayMvc/RaceDayMvc.csproj \
            Dockerfile \
            README.md \
            .github/workflows
          do
            if [ -e "$path" ]; then
              echo "OK       $path"
            else
              echo "MISSING  $path"
              missing=1
            fi
          done
          exit $missing

      - name: Check every project is listed in the solution
        run: |
          for project in RaceDayApi RaceDayApi.Tests RaceDayMvc; do
            if grep -q "\"$project\"" RaceDayApi.sln; then
              echo "OK       $project is in RaceDayApi.sln"
            else
              echo "MISSING  $project is not in RaceDayApi.sln"
              exit 1
            fi
          done

  build-and-test:
    name: Build and test (API, tests, MVC)
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayApi.sln

      - name: Build every project in the solution
        run: dotnet build RaceDayApi.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDayApi.sln --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build the MVC Docker image
    runs-on: ubuntu-latest
    needs: validate-structure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag raceday-mvc:ci .
